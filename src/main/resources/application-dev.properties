# profil dev : logs SQL + donnees de test / dev profile: SQL logs + seed data
spring.jpa.show-sql=true
logging.level.customer_complaint=DEBUG
app.dev.seed-password=${DEV_SEED_PASSWORD:password123}
app.reset.log-link=true

# e-mail local : MailHog (ou Mailpit) ecoute en SMTP sur 1025, interface web http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
