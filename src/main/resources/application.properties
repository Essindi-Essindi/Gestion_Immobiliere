spring.application.name=Gestion_Immobiliere

# charge .env (racine du projet) s'il existe ; sur Render/serveur on utilise les vraies variables d'environnement
# loads .env (project root) if present; on Render/servers real environment variables are used
spring.config.import=optional:file:.env[.properties]

# mysql config / config mysql (override via env vars)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_immobiliere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# jwt / auth : JWT_SECRET obligatoire (32 caracteres minimum), aucune valeur par defaut
app.jwt.secret=${JWT_SECRET}
JWT_SECRET=fjrus452TYHJ23#@mkforn58VBSt6784KMe$%3##
app.jwt.access-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-days=${JWT_REFRESH_DAYS:7}
app.security.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# cors : URL exacte d'Angular (pas de *), plusieurs URL separees par des virgules
app.cors.origin=${CORS_ORIGIN:http://localhost:4200}

# limitation de debit par IP : login = 10/min, reinitialisation = 5 / 15 min
app.ratelimit.login.max=${RATE_LOGIN_MAX:10}
app.ratelimit.login.window-seconds=60
app.ratelimit.reset.max=${RATE_RESET_MAX:5}
app.ratelimit.reset.window-seconds=900

# e-mail : definir SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD (variables d'environnement)
app.mail.from=${MAIL_FROM:no-reply@gestion-immobiliere.local}
app.invitation.hours=${INVITATION_HOURS:72}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# jamais d attente infinie sur le serveur SMTP (millisecondes)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# premier admin (optionnel, cree seulement s'il n'existe aucun admin)
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jpa.open-in-view=false
