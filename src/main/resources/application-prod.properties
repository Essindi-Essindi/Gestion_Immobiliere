# profil prod (Render) : active avec SPRING_PROFILES_ACTIVE=prod / prod profile (Render)

# Render fournit le port dans la variable PORT / Render gives the port in PORT
server.port=${PORT:8080}
# derriere le proxy de Render : sans cela toutes les IP seraient celles du proxy et la limitation de debit serait commune
# behind Render's proxy: without this every IP is the proxy's and the rate limit would be shared
server.forward-headers-strategy=native

spring.jpa.show-sql=false
logging.level.customer_complaint=INFO

# jamais de lien secret dans les logs / never log secret links
app.reset.log-link=false

# Render bloque le SMTP : e-mails via l'API Brevo / Render blocks SMTP: e-mails go through the Brevo API
app.mail.provider=${MAIL_PROVIDER:brevo}

# jeu de donnees initial charge une seule fois sur la base vide (Aiven) ; mettre SEED_DATABASE=false pour le desactiver
# initial data loaded once on the empty database (Aiven); set SEED_DATABASE=false to disable
app.seed.enabled=${SEED_DATABASE:true}
