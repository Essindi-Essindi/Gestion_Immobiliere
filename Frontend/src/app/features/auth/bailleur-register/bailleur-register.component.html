<div class="page">
      <app-auth-aside
        role="Bailleur"
        eyebrow="Espace bailleur"
        [title]="'Rejoignez\nla plateforme'"
        subtitle="Créez votre espace propriétaire et centralisez votre gestion locative."
      ></app-auth-aside>
      <div class="body">
        <div class="card">
          <h1 class="card-title">Créer un compte Bailleur</h1>
          <p class="card-subtitle">Rejoignez la plateforme de gestion immobilière</p>

          @if (errorMessage()) {
            <div class="alert alert-error">{{ errorMessage() }}</div>
          }
          @if (successMessage()) {
            <div class="alert alert-success">{{ successMessage() }}</div>
          }

          <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="field">
                <label class="field-label" for="lastName">Nom</label>
                <input id="lastName" class="field-input" type="text" formControlName="lastName" placeholder="Dupont" />
              </div>
              <div class="field">
                <label class="field-label" for="firstName">Prénom</label>
                <input id="firstName" class="field-input" type="text" formControlName="firstName" placeholder="Jean" />
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="email">Email</label>
              <input id="email" class="field-input" type="email" formControlName="email" placeholder="votre@email.com" />
            </div>
            <div class="field">
              <label class="field-label" for="phone">Téléphone</label>
              <input id="phone" class="field-input" type="tel" formControlName="phone" placeholder="+33 6 12 34 56 78" />
            </div>
            <div class="field">
              <label class="field-label" for="address">Adresse <span class="optional">(optionnel)</span></label>
              <input id="address" class="field-input" type="text" formControlName="address" placeholder="12 rue des Lilas, Paris" />
            </div>
            <div class="field">
              <label class="field-label" for="password">Mot de passe</label>
              <input id="password" class="field-input" type="password" formControlName="password" placeholder="10 caractères minimum" />
            </div>
            <div class="field">
              <label class="field-label" for="confirmPassword">Confirmer mot de passe</label>
              <input id="confirmPassword" class="field-input" type="password" formControlName="confirmPassword" placeholder="••••••••" />
            </div>
            <button type="submit" class="btn-primary" [disabled]="isLoading() || registerForm.disabled">
              <span>{{ isLoading() ? 'Envoi...' : 'S\'inscrire' }}</span>
            </button>
          </form>

          <div class="links">
            <a routerLink="/auth/bailleur/login" class="link">Déjà un compte ? Se connecter</a>
          </div>
        </div>
      </div>
    </div>
