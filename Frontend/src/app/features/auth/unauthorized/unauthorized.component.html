<div class="page">
      <app-auth-aside
        role="Accès restreint"
        eyebrow="Erreur 403"
        [title]="'Accès\nrestreint'"
        subtitle="Vous n'avez pas les permissions nécessaires. Retournez à l'accueil ou contactez un administrateur."
      ></app-auth-aside>
      <div class="body">
        <div class="card">
          <div class="error-code">403</div>
          <h1 class="title">Accès non autorisé</h1>
          <p class="message">Vous n'avez pas les permissions nécessaires pour accéder à cette page.</p>
          <div class="actions">
            <a routerLink="/" class="btn-primary">Retour à l'accueil</a>
          </div>
        </div>
      </div>
    </div>
