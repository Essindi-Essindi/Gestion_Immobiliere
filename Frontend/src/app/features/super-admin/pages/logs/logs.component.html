<div class="page">
  <div class="page-header">
    <div>
      <h1>Logs & Activité</h1>
      <p>Journal des actions effectuées sur la plateforme</p>
    </div>
  </div>

  <!-- pas d'IP ni d'export cote backend, uniquement type/message/actor/date -->
  <!-- no IP or export from the backend, only type/message/actor/date -->
  <div class="card">
    <div class="card-toolbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Rechercher dans les logs..." [(ngModel)]="searchTerm" (ngModelChange)="applyFilters()">
      </div>
      <input type="text" class="type-input" placeholder="Type..." [(ngModel)]="typeFilter" (ngModelChange)="applyFilters()">
      <div class="date-range">
        <input type="date" [(ngModel)]="fromDate" (ngModelChange)="applyFilters()">
        <span>à</span>
        <input type="date" [(ngModel)]="toDate" (ngModelChange)="applyFilters()">
      </div>
    </div>

    <app-state-block [loading]="loading()" [error]="error()" [empty]="logs().length === 0" emptyMessage="Aucun log trouvé.">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Utilisateur</th>
              <th>Type</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody>
            @for (log of logs(); track log.id) {
              <tr>
                <td class="cell-mono">{{ log.date }}</td>
                <td class="cell-bold">{{ log.user }}</td>
                <td><span class="action-badge">{{ log.type }}</span></td>
                <td>{{ log.details }}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <button class="btn-outline" [disabled]="page() === 1" (click)="prevPage()">‹ Précédent</button>
        <span class="page-info">Page {{ page() }} / {{ totalPages() }}</span>
        <button class="btn-black" [disabled]="page() === totalPages()" (click)="nextPage()">Suivant ›</button>
      </div>
    </app-state-block>
  </div>
</div>
