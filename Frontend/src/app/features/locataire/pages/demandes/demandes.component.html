<app-state-block [loading]="loading()" [error]="error()">
<div style="padding:24px;background:#f5f5f5;min-height:100vh;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <div>
          <h1 style="margin:0 0 4px;font-size:24px;font-weight:700;color:#000;">Mes Demandes</h1>
          <p style="margin:0;color:#757575;font-size:14px;">Suivi de tous vos signalements</p>
        </div>
        <a routerLink="/locataire/problemes" style="padding:12px 24px;background:#000;color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;text-decoration:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nouveau signalement
        </a>
      </div>

      <div style="background:#fff;border:1px solid #e0e0e0;">
        <div style="padding:16px 20px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between;">
          <h2 style="margin:0;font-size:16px;font-weight:600;color:#000;">Toutes les demandes</h2>
          <select [(ngModel)]="filterStatus" (change)="refresh()" style="padding:8px 12px;border:1px solid #e0e0e0;font-size:13px;background:#fff;color:#000;">
            <option value="all">Tous les statuts</option>
            <option value="NOUVEAU">Nouveau</option>
            <option value="EN_COURS">En cours</option>
            <option value="TERMINE">Terminé</option>
          </select>
        </div>
        <table style="width:100%;border-collapse:collapse;">
          <thead>
            <tr style="background:#fafafa;">
              <th style="padding:12px 20px;text-align:left;font-size:12px;color:#757575;text-transform:uppercase;border-bottom:1px solid #e0e0e0;">Titre</th>
              <th style="padding:12px 20px;text-align:left;font-size:12px;color:#757575;text-transform:uppercase;border-bottom:1px solid #e0e0e0;">Statut</th>
              <th style="padding:12px 20px;text-align:left;font-size:12px;color:#757575;text-transform:uppercase;border-bottom:1px solid #e0e0e0;">Date</th>
              <th style="padding:12px 20px;text-align:left;font-size:12px;color:#757575;text-transform:uppercase;border-bottom:1px solid #e0e0e0;">Réponse</th>
            </tr>
          </thead>
          <tbody>
            @for (d of demandes(); track d.id) {
              <tr style="border-bottom:1px solid #f0f0f0;">
                <td style="padding:14px 20px;font-size:14px;color:#000;font-weight:500;">{{ d.title }}</td>
                <td style="padding:14px 20px;">
                  <span style="padding:4px 12px;font-size:12px;font-weight:600;" [style.background]="getStatutBg(d.status)" [style.color]="getStatutColor(d.status)">
                    {{ formatStatut(d.status) }}
                  </span>
                </td>
                <td style="padding:14px 20px;font-size:14px;color:#424242;">{{ d.created_at | dateFr }}</td>
                <td style="padding:14px 20px;font-size:13px;color:#616161;">{{ d.response || '—' }}</td>
              </tr>
            }
            @empty {
              <tr>
                <td colspan="4" style="padding:40px 20px;text-align:center;color:#9e9e9e;font-size:14px;">Aucune demande trouvée</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
</app-state-block>
